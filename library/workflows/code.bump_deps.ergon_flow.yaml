workflow:
  id: code.bump_deps.ergon_flow
  version: 1
  description: "Bump dependencies safely for the Ergon Flow monorepo: scan → propose plan → apply updates → tests → review → manual gate → notify."
  author: "ergon-flow"
  tags: ["code", "deps", "maintenance", "pr", "ergon-flow"]

inputs:
  repo_path:
    type: string
    description: "Local filesystem path to the Ergon Flow git repository."
    default: "/Volumes/dev/repos/ergon-flow"

  base_branch:
    type: string
    description: "Branch to start from."
    default: "main"

  new_branch:
    type: string
    description: "Branch to create for dependency bumps."
    default: "chore/deps/ergon-flow-refresh"

  ecosystem:
    type: string
    description: "Dependency ecosystem (informational)."
    default: "node"

  policy:
    type: string
    description: "Update policy and constraints."
    default: "Prefer minor/patch updates in this PNPM workspace monorepo. Avoid major updates unless explicitly requested. Keep pnpm biome, pnpm typecheck, pnpm build, and pnpm test green."

  include:
    type: array
    description: "Optional list of dependency names to include (empty means all)."
    default: []

  exclude:
    type: array
    description: "Optional list of dependency names to exclude."
    default: []

  scan_command:
    type: string
    description: "Command that outputs the current dependency state and outdated report."
    default: "pnpm outdated -r || true"

  update_command:
    type: string
    description: "Command that performs the dependency update."
    default: "pnpm update -r"

  install_command:
    type: string
    description: "Command to reinstall dependencies after updates."
    default: "pnpm install --no-frozen-lockfile"

  test_command:
    type: string
    description: "Command to run the local repository gate."
    default: "pnpm biome && pnpm typecheck && pnpm build && pnpm test"

  notify:
    type: object
    description: "Notification backend config."
    default:
      channel: "stdout"
      target: ""
      message_prefix: "[ergon-flow]"

on_failure:
  - id: notify.failure
    kind: notify
    name: "Notify failure"
    description: "Send a failure notification when the workflow aborts before completion."
    channel: "{{ inputs.notify.channel }}"
    target: "{{ inputs.notify.target }}"
    message: |
      {{ inputs.notify.message_prefix }} Workflow failed: code.bump_deps.ergon_flow

      Repo: {{ inputs.repo_path }}
      Branch: {{ inputs.new_branch }} (from {{ inputs.base_branch }})

      Failed step: {{ artifacts.failure.step_id }}
      Error code: {{ artifacts.failure.code }}
      Error message: {{ artifacts.failure.message }}

steps:
  - id: repo.prepare
    kind: exec
    name: "Prepare repo branch"
    description: "Fetch, checkout base branch, create new branch for dependency bump."
    cwd: "{{ inputs.repo_path }}"
    command: |
      set -euo pipefail
      git fetch --all --prune
      git checkout {{ inputs.base_branch }}
      git pull --ff-only
      git checkout -B {{ inputs.new_branch }}

  - id: scan.should
    kind: condition
    name: "Should scan deps?"
    description: "Skip scan step if scan_command is empty."
    expression: "{{ inputs.scan_command }}"

  - id: deps.scan
    kind: exec
    name: "Scan dependencies"
    description: "Run the repository outdated report."
    depends_on: [scan.should]
    cwd: "{{ inputs.repo_path }}"
    command: |
      set -euo pipefail
      pnpm outdated -r || true

  - id: plan
    kind: agent
    name: "Propose dependency update plan"
    description: "Decide what to update and produce a safe plan for a single PR."
    provider: openrouter
    model: deepseek/deepseek-v3.2
    output:
      name: plan
      type: plan
    prompt: |
      You are maintaining the Ergon Flow production codebase. Propose a dependency update plan.

      Repository path:
      {{ inputs.repo_path }}

      Ecosystem:
      {{ inputs.ecosystem }}

      Policy:
      {{ inputs.policy }}

      Include (may be empty):
      {{ inputs.include }}

      Exclude (may be empty):
      {{ inputs.exclude }}

      Outdated/dependency scan output (may be empty if scan was skipped):
      {{ artifacts.deps.scan.stdout }}

      Produce structured JSON with keys:
      - summary
      - update_set (array of {name, from, to, reason, risk})
      - commands (object: {update_command, install_command})
      - verification (array of checks)
      - pr_title
      - pr_body

      Rules:
      - Prefer minor/patch upgrades unless explicitly requested
      - Avoid major bumps unless clearly safe
      - Keep the PNPM workspace build and test gate green
      - If scan output is missing, infer a conservative plan and ask to provide scan_command

  - id: update.should
    kind: condition
    name: "Should run update command?"
    description: "Skip update step if update_command is empty."
    expression: "{{ inputs.update_command }}"

  - id: deps.update
    kind: exec
    name: "Apply dependency updates"
    description: "Run update command and stage changes."
    depends_on: [update.should]
    cwd: "{{ inputs.repo_path }}"
    command: |
      set -euo pipefail
      pnpm update -r

  - id: install.should
    kind: condition
    name: "Should install after update?"
    description: "Skip install if install_command is empty."
    expression: "{{ inputs.install_command }}"

  - id: deps.install
    kind: exec
    name: "Install dependencies"
    description: "Reinstall dependencies after updates."
    depends_on: [install.should]
    cwd: "{{ inputs.repo_path }}"
    command: |
      set -euo pipefail
      pnpm install --no-frozen-lockfile

  - id: tests.should
    kind: condition
    name: "Should run tests?"
    description: "Skip tests if test_command is empty."
    expression: "{{ inputs.test_command }}"

  - id: tests.exec
    kind: exec
    name: "Run tests"
    description: "Run the repository validation commands and capture results."
    depends_on: [tests.should]
    cwd: "{{ inputs.repo_path }}"
    command: |
      set -euo pipefail
      pnpm biome
      pnpm typecheck
      pnpm build
      pnpm test

  - id: review
    kind: agent
    name: "Review changes and produce PR text"
    description: "Summarize changes, assess risk, and generate final PR title/body."
    provider: openrouter
    model: moonshotai/kimi-k2.5
    output:
      name: review
      type: json
    prompt: |
      You are a senior maintainer reviewing dependency updates for Ergon Flow.

      Planned update set (JSON):
      {{ artifacts.plan }}

      Scan output (may be empty):
      {{ artifacts.deps.scan.stdout }}

      Update execution output (may be empty if skipped):
      {{ artifacts.deps.update.stdout }}

      Install output (may be empty if skipped):
      {{ artifacts.deps.install.stdout }}

      Test output (may be empty if skipped):
      {{ artifacts.tests.exec.stdout }}

      Produce structured JSON with keys:
      - summary
      - change_type
      - risk_level
      - validation_status
      - recommended_followups
      - final_pr_title
      - final_pr_body

      Keep the review concrete and repository-specific.

  - id: approve
    kind: manual
    name: "Manual approval"
    description: "Require explicit approval before notification/merge handoff."
    prompt: |
      Review the dependency bump for Ergon Flow.

      Summary:
      {{ artifacts.review.summary }}

      Branch:
      {{ inputs.new_branch }} (from {{ inputs.base_branch }})

      Decision required: approve or reject.

  - id: notify
    kind: notify
    name: "Notify user"
    description: "Send final notification (stdout/webhook/openclaw)."
    channel: "{{ inputs.notify.channel }}"
    target: "{{ inputs.notify.target }}"
    message: |
      {{ inputs.notify.message_prefix }} Workflow completed: code.bump_deps.ergon_flow

      Repo: {{ inputs.repo_path }}
      Branch: {{ inputs.new_branch }} (from {{ inputs.base_branch }})

      Next action: open PR / review / merge.

      Summary:
      {{ artifacts.review.summary }}

outputs:
  plan: artifacts.plan
  review: artifacts.review
  branch: inputs.new_branch
  base_branch: inputs.base_branch
